[workspace]
members = ["macros"]

[package]
name = "tensorcrate"
version = "0.1.0"
edition = "2024"

[dependencies]
tensorcrate-macros = { path = "macros" }
half = { version = "2.7", features = ["num-traits"] }
num-traits = "0.2"
typenum = "1.20"

[features]
default = ["metal", "simd"]
# GPU-accelerated tensor ops via Apple Metal (macOS only).
metal = ["dep:dispatch2", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# NEON on aarch64; runtime-selected AVX2/FMA or SSE2 on x86_64.
simd = []

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
