[workspace]
members = ["macros"]

[package]
name = "rinterp"
version = "0.1.0"
edition = "2024"

[dependencies]
rinterp-macros = { path = "macros" }
num-traits = "0.2"
typenum = "1.20"

[features]
default = ["metal", "simd"]
# GPU-accelerated tensor ops via Apple Metal (macOS only).
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# NEON-vectorized CPU math kernels (aarch64 only; a no-op on other targets).
simd = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }

